[project]
name = "firmwright"
version = "0.1.0"
description = "An event-driven desktop agent for embedded development (Python core / sidecar)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyserial>=3.5",
    "keyring>=25",
    "pypdf>=6",  # W6：read_file 读芯片手册 PDF（纯 Python）
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "pyright>=1.1.400"]

[project.scripts]
firmwright-core = "firmwright.acp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["firmwright*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

# 类型检查：standard 模式，只查核心包（测试里大量替身对象，不查）。
# 本地：python -m pyright --pythonpath .venv/Scripts/python.exe；CI 里直接用当前环境的 python
[tool.pyright]
include = ["firmwright"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
